<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <title>PROTEIN STUDIO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script>(()=>{let t="jewel";try{const s=localStorage.getItem("protein_studio_theme");if(["jewel","kpop","neon","sunset"].includes(s))t=s}catch{}document.documentElement.dataset.theme=t})()</script>
  <link rel="stylesheet" href="styles.css?v=49">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<img id="themeBgImage" class="theme-bg-image" src="rhinestones.jpg" alt="" aria-hidden="true">
<div class="shell">
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand"><span>PROTEIN</span> STUDIO</div>
      <p class="muted">Личный кабинет клиента клуба</p>

      <div id="loginBox">
        <label>Телефон<input id="loginPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 999 000-00-00"></label>
        <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password"></label>
        <button class="btn primary" id="loginBtn">Войти</button>
        <button class="btn ghost" id="showRegisterBtn">Я новый клиент</button>
      </div>

      <div id="registerBox" class="hidden">
        <label>Имя и фамилия<input id="regName" autocomplete="name"></label>
        <label>Телефон<input id="regPhone" autocomplete="tel"></label>
        
        <label>Пароль<input id="regPassword" type="password" autocomplete="new-password"></label>
        <label>Мой консультант<select id="regConsultant"></select></label>
        <button class="btn primary" id="registerBtn">Зарегистрироваться</button>
        <button class="btn ghost" id="showLoginBtn">У меня уже есть аккаунт</button>
      </div>
      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <section id="setupScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="brand"><span>PROTEIN</span> STUDIO</div>
      <h2>Подключение</h2>
      <p class="muted">Однократно укажите публичные данные Supabase для этого приложения.</p>
      <label>Supabase URL<input id="setupUrl" placeholder="https://...supabase.co"></label>
      <label>Publishable key<input id="setupKey" placeholder="sb_publishable_..."></label>
      <button class="btn primary" id="saveSetupBtn">Сохранить подключение</button>
    </div>
  </section>

  <section id="onboardingScreen" class="auth-screen hidden">
    <div class="auth-card wellness-card">
      <div class="brand"><span>PROTEIN</span> STUDIO</div>

      <div class="wellness-heading">
        <div class="eyebrow">Короткая Wellness-цель</div>
        <span id="wellnessCounter">Шаг 1 из 4</span>
      </div>
      <div class="wellness-track"><i id="wellnessBar"></i></div>

      <div id="wellnessContent"></div>

      <div class="step-actions wellness-actions">
        <button class="btn ghost" id="wellnessBackBtn">← Назад</button>
        <button class="btn primary" id="wellnessNextBtn">Продолжить</button>
      </div>
      <p id="onboardingMessage" class="message"></p>
    </div>
  </section>

  <section id="appScreen" class="hidden">
    <aside id="drawer" class="drawer">
      <div class="drawer-brand">PROTEIN STUDIO</div>
      <div id="drawerPerson" class="drawer-person"></div>
      <button data-page="admin" id="adminNav" class="nav hidden">🗂 Панель консультанта</button>
      <button data-page="plan" class="nav active">📋 Мой план</button>
      <button data-page="nutrition" class="nav">🥗 Питание</button>
      <button data-page="workouts" class="nav">🏋🏻‍♀️ Тренировки</button>
      <button data-page="marathon" class="nav">🔥 Марафон</button>
      <button data-page="progress" class="nav">📈 Прогресс</button>
      <button data-page="achievements" class="nav">🏆 Достижения</button>
      <button data-page="community" class="nav">👥 Сообщество</button>
      <button data-page="consultant" class="nav">💬 Мой консультант</button>
      <button data-page="notifications" class="nav">🔔 Уведомления</button>
      <button data-page="profile" class="nav">👤 Профиль</button>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <header class="topbar">
      <button id="menuBtn" class="menu-btn">☰</button>
      <strong id="pageTitle">Мой план</strong>
    </header>
    <main id="content"></main>
  </section>
</div>
<script src="config.js?v=49"></script>
<script src="community.js?v=49"></script>
<script src="admin.js?v=49"></script>
<script src="app.js?v=49"></script>
</body>
</html>
