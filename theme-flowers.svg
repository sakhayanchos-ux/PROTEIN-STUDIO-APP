<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1000">
<defs>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#f7f0e6"/></linearGradient>
  <linearGradient id="rosePink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb5ce"/><stop offset=".6" stop-color="#eb77a6"/><stop offset="1" stop-color="#c64f80"/></linearGradient>
  <linearGradient id="rosePurple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8b3ff"/><stop offset=".6" stop-color="#9f65d8"/><stop offset="1" stop-color="#7340a3"/></linearGradient>
  <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd1a0"/><stop offset=".6" stop-color="#f5a35c"/><stop offset="1" stop-color="#dc7c32"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7eaff"/><stop offset=".6" stop-color="#79c4e6"/><stop offset="1" stop-color="#4aa3cd"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c6e78f"/><stop offset=".6" stop-color="#82b95d"/><stop offset="1" stop-color="#4f873c"/></linearGradient>
  <filter id="softShadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8a6a67" flood-opacity=".18"/></filter>
  <symbol id="rose" viewBox="-45 -45 90 90">
    <circle r="34" fill="currentColor" opacity=".95"/>
    <path d="M0-29C16-29 29-16 29 0S16 29 0 29-29 16-29 0-16-29 0-29Zm0 8C-11-21-21-11-21 0S-11 21 0 21 21 11 21 0 11-21 0-21Zm0 8C7-13 13-7 13 0S7 13 0 13-13 7-13 0-7-13 0-13Z" fill="#fff" opacity=".24"/>
  </symbol>
  <symbol id="daisy" viewBox="-45 -45 90 90">
    <g fill="currentColor">
      <ellipse rx="10" ry="28" transform="rotate(0) translate(0 -14)"/>
      <ellipse rx="10" ry="28" transform="rotate(45) translate(0 -14)"/>
      <ellipse rx="10" ry="28" transform="rotate(90) translate(0 -14)"/>
      <ellipse rx="10" ry="28" transform="rotate(135) translate(0 -14)"/>
    </g>
    <circle r="13" fill="#f7c64a"/>
  </symbol>
  <symbol id="pom" viewBox="-44 -44 88 88">
    <g fill="currentColor" opacity=".96">
      <circle cx="-15" cy="-16" r="17"/><circle cx="9" cy="-17" r="17"/><circle cx="19" cy="4" r="17"/>
      <circle cx="8" cy="20" r="17"/><circle cx="-15" cy="18" r="17"/><circle cx="-22" cy="-3" r="17"/><circle r="18"/>
    </g>
    <circle r="8" fill="#fff" opacity=".22"/>
  </symbol>
  <symbol id="leafPair" viewBox="-40 -30 80 60">
    <path d="M0 0C-10-28-38-22-35-4-32 13-13 15 0 0Z" fill="url(#leaf)"/>
    <path d="M0 0C10-28 38-22 35-4 32 13 13 15 0 0Z" fill="url(#leaf)"/>
  </symbol>
</defs>
<rect width="520" height="1000" fill="url(#cream)"/>
<circle cx="260" cy="450" r="260" fill="#fff" opacity=".18"/>

<!-- top corners -->
<g filter="url(#softShadow)">
  <g transform="translate(35 55) scale(1.15)" color="#eb77a6"><use href="#rose"/></g>
  <g transform="translate(88 40) scale(.85)" color="#9f65d8"><use href="#rose"/></g>
  <g transform="translate(135 73) scale(.72)" color="#79c4e6"><use href="#pom"/></g>
  <g transform="translate(470 50) scale(1.05)" color="#f5a35c"><use href="#rose"/></g>
  <g transform="translate(425 36) scale(.78)" color="#ffb5ce"><use href="#daisy"/></g>
  <g transform="translate(383 78) scale(.72)" color="#9f65d8"><use href="#pom"/></g>
</g>

<!-- left floral border -->
<g filter="url(#softShadow)">
  <g transform="translate(28 205) scale(.92)" color="#79c4e6"><use href="#daisy"/></g>
  <g transform="translate(76 258) scale(.75)" color="#eb77a6"><use href="#rose"/></g>
  <g transform="translate(25 350) scale(.95)" color="#9f65d8"><use href="#pom"/></g>
  <g transform="translate(75 445) scale(.7)" color="#f5a35c"><use href="#rose"/></g>
  <g transform="translate(25 540) scale(.92)" color="#ffb5ce"><use href="#daisy"/></g>
  <g transform="translate(76 635) scale(.75)" color="#79c4e6"><use href="#pom"/></g>
  <g transform="translate(25 745) scale(.98)" color="#eb77a6"><use href="#rose"/></g>
  <g transform="translate(77 850) scale(.72)" color="#9f65d8"><use href="#daisy"/></g>
  <g transform="translate(29 950) scale(.9)" color="#f5a35c"><use href="#pom"/></g>
</g>

<!-- right floral border -->
<g filter="url(#softShadow)">
  <g transform="translate(490 190) scale(.88)" color="#9f65d8"><use href="#rose"/></g>
  <g transform="translate(442 285) scale(.75)" color="#79c4e6"><use href="#daisy"/></g>
  <g transform="translate(490 390) scale(.95)" color="#f5a35c"><use href="#pom"/></g>
  <g transform="translate(444 485) scale(.7)" color="#eb77a6"><use href="#rose"/></g>
  <g transform="translate(490 585) scale(.92)" color="#79c4e6"><use href="#daisy"/></g>
  <g transform="translate(444 680) scale(.75)" color="#9f65d8"><use href="#pom"/></g>
  <g transform="translate(490 785) scale(.96)" color="#ffb5ce"><use href="#rose"/></g>
  <g transform="translate(443 885) scale(.74)" color="#f5a35c"><use href="#daisy"/></g>
</g>

<!-- greenery -->
<g opacity=".8">
  <g transform="translate(58 126) rotate(-20) scale(.8)"><use href="#leafPair"/></g>
  <g transform="translate(462 120) rotate(22) scale(.75)"><use href="#leafPair"/></g>
  <g transform="translate(62 710) rotate(-30) scale(.7)"><use href="#leafPair"/></g>
  <g transform="translate(458 735) rotate(28) scale(.75)"><use href="#leafPair"/></g>
  <g transform="translate(55 915) rotate(-20) scale(.65)"><use href="#leafPair"/></g>
  <g transform="translate(462 955) rotate(18) scale(.7)"><use href="#leafPair"/></g>
</g>

<!-- a few drifting petals near edges -->
<g fill="#e78fb1" opacity=".65">
  <ellipse cx="116" cy="175" rx="5" ry="9" transform="rotate(24 116 175)"/>
  <ellipse cx="403" cy="245" rx="5" ry="9" transform="rotate(-28 403 245)"/>
  <ellipse cx="111" cy="600" rx="5" ry="9" transform="rotate(-20 111 600)"/>
  <ellipse cx="410" cy="820" rx="5" ry="9" transform="rotate(20 410 820)"/>
</g>
</svg>