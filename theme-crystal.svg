<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1000">
<defs>
  <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdfd"/><stop offset=".45" stop-color="#f6f2f6"/><stop offset="1" stop-color="#eee9ed"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff96d8"/><stop offset=".45" stop-color="#f03ca8"/><stop offset="1" stop-color="#a60b63"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ff3ff"/><stop offset=".5" stop-color="#22bde8"/><stop offset="1" stop-color="#1160b9"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1bdff"/><stop offset=".5" stop-color="#9c5ad8"/><stop offset="1" stop-color="#64329a"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6ff8e"/><stop offset=".5" stop-color="#89d641"/><stop offset="1" stop-color="#4b9820"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a6"/><stop offset=".5" stop-color="#ffbe35"/><stop offset="1" stop-color="#d87d05"/></linearGradient>
  <linearGradient id="clear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#dfeafa"/><stop offset="1" stop-color="#a5b8d6"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#72546f" flood-opacity=".28"/></filter>
  <filter id="spark"><feGaussianBlur stdDeviation="1.2"/></filter>
  <symbol id="gemRound" viewBox="-24 -24 48 48">
    <circle r="21" fill="currentColor" opacity=".92"/><path d="M0-21 10-10 21 0 10 10 0 21-10 10-21 0-10-10Z" fill="#fff" opacity=".28"/><circle r="11" fill="#fff" opacity=".12"/>
  </symbol>
  <symbol id="gemSquare" viewBox="-26 -26 52 52">
    <rect x="-20" y="-20" width="40" height="40" rx="6" transform="rotate(12)" fill="currentColor"/>
    <path d="M0-17 16 0 0 17-16 0Z" fill="#fff" opacity=".25"/>
    <path d="M-11-11 0-17 11-11 17 0 11 11 0 17-11 11-17 0Z" fill="none" stroke="#fff" stroke-opacity=".35"/>
  </symbol>
  <symbol id="heart" viewBox="-30 -28 60 56">
    <path d="M0 22C-30 4-28-18-12-22-4-24 0-17 0-12 0-17 4-24 12-22 28-18 30 4 0 22Z" fill="currentColor"/>
    <path d="M-9-13C-4-16 0-12 0-8 1-11 4-14 8-14" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
  </symbol>
  <symbol id="star" viewBox="-30 -30 60 60">
    <path d="M0-27 7-8 27 0 7 8 0 27-7 8-27 0-7-8Z" fill="currentColor"/>
    <path d="M0-19 4-5 18 0 4 5 0 19-4 5-18 0-4-5Z" fill="#fff" opacity=".25"/>
  </symbol>
  <symbol id="butterfly" viewBox="-35 -28 70 56">
    <path d="M-3 0C-15-28-34-20-29-5c3 9 13 11 24 7C-18 18-11 28-2 14Z" fill="currentColor"/>
    <path d="M3 0C15-28 34-20 29-5c-3 9-13 11-24 7C18 18 11 28 2 14Z" fill="currentColor"/>
    <rect x="-2" y="-12" width="4" height="28" rx="2" fill="#fff" opacity=".65"/>
  </symbol>
</defs>
<rect width="520" height="1000" fill="url(#pearl)"/>
<circle cx="260" cy="180" r="190" fill="#ffffff" opacity=".14"/>
<circle cx="250" cy="720" r="230" fill="#f5eef8" opacity=".16"/>

<!-- left edge -->
<g filter="url(#shadow)">
  <g transform="translate(38 70) scale(1.05)" color="#f03ca8"><use href="#star"/></g>
  <g transform="translate(77 145) scale(.7)" color="#22bde8"><use href="#gemRound"/></g>
  <g transform="translate(35 220) scale(.95)" color="#9c5ad8"><use href="#heart"/></g>
  <g transform="translate(84 295) scale(.72)" color="#89d641"><use href="#gemSquare"/></g>
  <g transform="translate(30 385) scale(1.02)" color="#22bde8"><use href="#butterfly"/></g>
  <g transform="translate(78 470) scale(.65)" color="#ffbe35"><use href="#gemRound"/></g>
  <g transform="translate(34 575) scale(1.08)" color="#f03ca8"><use href="#gemSquare"/></g>
  <g transform="translate(82 650) scale(.72)" color="#9c5ad8"><use href="#star"/></g>
  <g transform="translate(33 760) scale(.95)" color="#89d641"><use href="#heart"/></g>
  <g transform="translate(83 845) scale(.75)" color="#22bde8"><use href="#gemRound"/></g>
  <g transform="translate(35 935) scale(1.05)" color="#ffbe35"><use href="#butterfly"/></g>
</g>

<!-- right edge -->
<g filter="url(#shadow)">
  <g transform="translate(482 95) scale(.9)" color="#9c5ad8"><use href="#butterfly"/></g>
  <g transform="translate(440 180) scale(.7)" color="#ffbe35"><use href="#gemRound"/></g>
  <g transform="translate(485 275) scale(1.02)" color="#22bde8"><use href="#star"/></g>
  <g transform="translate(440 360) scale(.78)" color="#f03ca8"><use href="#heart"/></g>
  <g transform="translate(485 455) scale(.92)" color="#89d641"><use href="#gemSquare"/></g>
  <g transform="translate(438 550) scale(.67)" color="#9c5ad8"><use href="#gemRound"/></g>
  <g transform="translate(484 635) scale(1)" color="#f03ca8"><use href="#butterfly"/></g>
  <g transform="translate(440 730) scale(.72)" color="#22bde8"><use href="#heart"/></g>
  <g transform="translate(484 820) scale(.95)" color="#ffbe35"><use href="#star"/></g>
  <g transform="translate(442 915) scale(.82)" color="#89d641"><use href="#gemSquare"/></g>
</g>

<!-- small crisp scattered stones near edges only -->
<g opacity=".95">
  <circle cx="115" cy="95" r="8" fill="#f03ca8"/><circle cx="405" cy="130" r="7" fill="#22bde8"/>
  <circle cx="112" cy="330" r="6" fill="#ffbe35"/><circle cx="414" cy="415" r="8" fill="#9c5ad8"/>
  <circle cx="102" cy="525" r="7" fill="#89d641"/><circle cx="410" cy="600" r="6" fill="#f03ca8"/>
  <circle cx="110" cy="805" r="7" fill="#22bde8"/><circle cx="407" cy="870" r="8" fill="#ffbe35"/>
</g>
<g fill="#fff" opacity=".95">
  <circle cx="55" cy="120" r="3"/><circle cx="465" cy="235" r="3"/><circle cx="58" cy="510" r="3"/><circle cx="458" cy="690" r="3"/>
</g>
</svg>